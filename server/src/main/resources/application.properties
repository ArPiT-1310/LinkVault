spring.application.name=linkvault
server.port=8080
spring.config.import=optional:file:.env[.properties]
# ---------- MySQL ----------
# The database "linkvault" is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/linkvault?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-of-at-least-32-characters}

# Tables are created/updated from the entities on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---------- JWT ----------
# Must be at least 32 characters. Override with the JWT_SECRET environment variable in production.
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-of-at-least-32-characters}
jwt.expiration-ms=86400000

# ---------- CORS (comma-separated list of allowed frontend origins) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Lets error responses include the "message" field the React app displays.
server.error.include-message=always
